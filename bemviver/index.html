<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* =========================================================
   1. TOKENS
   ========================================================= */
:root{
  --green:#006633; --green-700:#00552a; --green-900:#004d26;
  --lime:#80a517;  --lime-soft:#d6eaa0;
  --mint:#e8f3ec;  --mint-2:#f2f8f4;
  --ink:#16241b;   --muted:#5f6f64; --faint:#93a198;
  --line:#e2e9e4;  --bg:#f3f6f2;
  --red:#b42318;   --amber:#b7791f; --amber-soft:#fff6e0;
  --r-md:14px; --r-lg:22px;
  --shadow-1:0 1px 2px rgba(10,40,20,.06),0 1px 1px rgba(10,40,20,.04);
  --shadow-2:0 12px 32px rgba(10,50,25,.10),0 2px 6px rgba(10,50,25,.06);
  --ring:0 0 0 4px rgba(0,102,51,.14);
  --bar-h:78px;
  --max:560px;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg)}
img,svg{display:block}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.shell{width:100%;max-width:var(--max);margin:0 auto}

/* =========================================================
   3. TOPO DO APP
   ========================================================= */
.appbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.appbar .shell{display:flex;align-items:center;gap:6px;height:60px;padding:0 16px}
.appbar img{height:30px;width:auto}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;margin-left:-10px;border:0;border-radius:12px;background:none;cursor:pointer;color:var(--green)}
.icon-btn:hover{background:var(--mint)}
.icon-btn:focus-visible{outline:none;box-shadow:var(--ring)}

.hero{background:radial-gradient(130% 150% at 100% 0%,#127c47 0%,var(--green) 48%,var(--green-900) 100%);color:#fff}
.hero .shell{position:relative;overflow:hidden;padding:22px 20px 64px}
.hero small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--lime-soft)}
.hero h1{margin:4px 0 0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.4px}
.hero svg{position:absolute;right:-24px;top:-6px;width:150px;opacity:.13}

/* =========================================================
   4. CARTÃO DA ETAPA
   ========================================================= */
.stage-wrap{padding:0 12px calc(var(--bar-h) + 24px + env(safe-area-inset-bottom))}
.stage{position:relative;margin-top:-44px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-2);overflow:hidden}
.progress{height:4px;background:var(--mint)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--lime));transition:width .35s ease}
.step{padding:22px 20px 26px}
.step.anim{animation:slide .28s cubic-bezier(.2,.8,.2,1)}
.step.anim.back{animation-name:slideBack}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--lime)}
.step h2{margin:4px 0 6px;font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.2px}
.step .sub{margin:0 0 18px;font-size:15px;color:var(--muted)}

/* =========================================================
   5. CAMPOS
   ========================================================= */
.label{display:block;margin:0 0 6px;font-size:14px;font-weight:700}
.field{display:block;width:100%;height:54px;padding:0 16px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--mint-2);
  font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.field::placeholder{color:var(--faint)}
.field:focus{border-color:var(--green);background:#fff;box-shadow:var(--ring)}
.group+.group{margin-top:18px}
.err{display:none;margin-top:8px;font-size:14px;font-weight:600;color:var(--red)}
.invalid .err{display:block}
.invalid .field{border-color:var(--red);background:#fff}

/* =========================================================
   6. LISTAS DE ESCOLHA
   ========================================================= */
.choices{display:grid;gap:10px}
.choices.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 14px;
  border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow-1);
  text-align:left;cursor:pointer;transition:border-color .15s,background .15s,transform .08s}
.choice:hover{border-color:#bcd0c2}
.choice:active{transform:scale(.99)}
.choice:focus-visible{outline:none;box-shadow:var(--ring)}
.choice .ic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--mint);
  color:var(--green);font-size:13px;font-weight:800;letter-spacing:.3px;transition:background .15s,color .15s}
.choice .tx{flex:1;min-width:0}
.choice .tx b{display:block;font-size:16.5px;font-weight:700;line-height:1.25}
.choice .tx span{display:block;margin-top:1px;font-size:13.5px;color:var(--muted)}
.choice .ck{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid #c3d1c7;color:transparent;transition:all .15s}
.choice[aria-checked="true"]{border-color:var(--green);background:var(--mint-2)}
.choice[aria-checked="true"] .ic{background:var(--green);color:#fff}
.choice[aria-checked="true"] .ck{border-color:var(--green);background:var(--green);color:#fff}
.choices.grid .choice{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:100px;padding:14px}
.choices.grid .choice .ck{position:absolute;top:12px;right:12px}

/* =========================================================
   7. HORÁRIOS
   ========================================================= */
.slot-group+.slot-group{margin-top:22px}
.slot-group>h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--green)}
.slot-group>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.escala{margin:12px 0 8px;font-size:13px;font-weight:800;color:var(--ink)}
.slot-group>h3+.escala{margin-top:0}
.period{margin:14px 0 8px;font-size:13.5px;font-weight:700;color:var(--muted)}
.period:first-of-type{margin-top:0}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;padding:0 4px;
  border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow-1);cursor:pointer;
  font-variant-numeric:tabular-nums;line-height:1.1;transition:border-color .15s,background .15s,box-shadow .15s}
.slot b{font-size:18px;font-weight:700}
.slot small{font-size:12px;color:var(--muted)}
.slot small em{font-style:normal;font-weight:700;color:var(--lime)}
.slot:hover{border-color:var(--green)}
.slot:focus-visible{outline:none;box-shadow:var(--ring)}
.slot[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 8px 16px rgba(0,102,51,.25)}
.slot[aria-pressed="true"] small,.slot[aria-pressed="true"] small em{color:var(--lime-soft)}
.skeleton{height:62px;border-radius:var(--r-md);background:linear-gradient(90deg,#edf2ee 0%,#f8fbf8 50%,#edf2ee 100%);
  background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.state-box{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-md);font-size:15px}
.state-box svg{flex:none;margin-top:1px}
.state-box b{display:block;margin-bottom:2px;font-size:16px}
.state-box.warn{background:var(--amber-soft);border:1.5px solid #f2d79a;color:#5c4206}
.state-box.info{background:var(--mint-2);border:1.5px dashed var(--line);color:var(--muted)}

/* =========================================================
   8. RESUMO
   ========================================================= */
.summary{margin:0 0 20px;padding:2px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--mint-2)}
.summary .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:15px}
.summary .row+.row{border-top:1px solid var(--line)}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:700;text-align:right}

/* =========================================================
   9. BARRA DE AÇÕES (fixa no rodapé)
   ========================================================= */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.actionbar .shell{display:flex;gap:10px;padding:12px 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 22px;border:0;border-radius:var(--r-md);
  font-size:17px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,opacity .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{flex:1;min-width:0;background:var(--green);color:#fff;box-shadow:0 8px 18px rgba(0,102,51,.22)}
.btn-primary:hover{background:var(--green-700)}
.btn-primary.amber{background:var(--amber);box-shadow:0 8px 18px rgba(183,121,31,.25)}
.btn-ghost{background:var(--mint);color:var(--green)}
.btn-ghost:hover{background:#dcece2}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn-block{width:100%}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* =========================================================
   10. CONFIRMAÇÃO E AVISOS
   ========================================================= */
.done{padding:34px 20px 28px;text-align:center}
.done .badge{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 18px;border-radius:50%;background:var(--green);color:#fff;
  box-shadow:0 0 0 10px var(--mint)}
.done .badge.res{background:var(--amber);box-shadow:0 0 0 10px #fdf1d8}
.done h2{margin:0 0 6px;font-size:25px;font-weight:800}
.done p{max-width:400px;margin:0 auto 22px;color:var(--muted)}
.done .summary{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 14px + env(safe-area-inset-bottom));z-index:20;width:max-content;max-width:min(92vw,480px);
  padding:12px 18px;border-radius:var(--r-md);background:var(--ink);color:#fff;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.2);
  transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{margin:18px 0 0;text-align:center;font-size:12.5px;color:var(--faint)}

/* =========================================================
   11. RESPONSIVO
   ========================================================= */
@media (min-width:480px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}.step{padding:28px 28px 30px}.hero h1{font-size:34px}}
@media (max-width:350px){.choices.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.btn{padding:0 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <button class="icon-btn" id="backTop" type="button" aria-label="Voltar" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <img src="logo-medsenior.png" alt="MedSênior" width="87" height="30">
</div></header>

<section class="hero"><div class="shell">

  <svg viewBox="0 0 200 200" aria-hidden="true"><path fill="#fff" d="M188 20C120 18 60 40 34 92c-18 36-10 78 18 96 6-40 26-78 64-104-30 30-46 64-50 104 52-6 96-46 116-104 8-24 8-48 6-64z"/></svg>

</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= CONFIGURAÇÃO ================= */
const SUPABASE_URL = "https://pplhwupjbrtzqdwzlcem.supabase.co";
const SUPABASE_KEY = "sb_publishable_0X4Jd1nj8bF6YcoqkbawvA_UPOkdH93";

const ESTADOS = [
  {v:"Distrito Federal", s:"DF"}, {v:"Espírito Santo", s:"ES"}, {v:"Minas Gerais", s:"MG"}, {v:"Rio de Janeiro", s:"RJ"},
  {v:"São Paulo", s:"SP"}, {v:"Sul", s:"SUL", d:"Curitiba e Porto Alegre"}, {v:"Pernambuco", s:"PE", d:"Recife"}
];
const UNIDADES = {
  "Distrito Federal":["PS- Taguatinga Sul","PS- SIG Brasília","Ambulatório Asa Sul","Unidade Águas Claras","Taguatinga Norte - Ambulatório","Comercial DF"],
  "Espírito Santo":["Hospital Vitória","PS Glória- CDM - Oftalmo","Matriz","Centro - ES","Bressan","Unidade Jerônimo","Unidade Serra"],
  "Minas Gerais":["PS Gutierrez","Hospital Pampulha","Funcionários","Amb. Contagem","Comercial MG","Savassi"],
  "Rio de Janeiro":["PS Botafogo","PS Barra da Tijuca","PS Campo Grande","Unidade Botafogo","Unidade Tijuca","Unidade Niterói","Comercial RJ"],
  "São Paulo":["Unidade Av. Brasil","Unidade Av. Paulista","Unidade Tatuapé","Unidade Santana","Unidade Sumarézinho","Unidade Campinas"],
  "Sul":["Ambulatório Curitiba","Ambulatório Porto Alegre"]
};
const UNIDADE_UNICA = {"Pernambuco":"Recife"};               /* estado sem pergunta de unidade */
const UNIDADES_PLANTAO = ["Hospital Vitória","PS Glória- CDM - Oftalmo","PS- Taguatinga Sul","PS- SIG Brasília",
  "PS Gutierrez","Hospital Pampulha","PS Botafogo","PS Barra da Tijuca","PS Campo Grande"];
const UNIDADES_ANDAR = ["Centro - ES"];
const UNIDADES_ATUACAO = ["Hospital Vitória"];              /* perguntam ADM ou Plantonista */
const GRUPOS_EXTRAS = {"ADM":"Horários ADM","Extra":"Horários extras"};
const MESES = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
/* o mês da pergunta do plantão vem do mês aberto pela equipe (cai no mês atual enquanto carrega) */
let MES_ATUAL = new Intl.DateTimeFormat("pt-BR",{month:"long",timeZone:"America/Sao_Paulo"}).format(new Date()).toUpperCase();
let MES_ABERTO = null;

/* ================= ESTADO ================= */
const VAZIO = () => ({nome:"",estado:"",unidade:"",atuacao:"",andar:"",plantao:"",sel:null,reserva:false,semDatas:false,
                      slots:[],chave:"",carregando:false,erroSlots:false,setor:"",celular:""});
let S = VAZIO();
let passo = 0, req = 0, enviando = false, concluido = false, autoTimer = null;

/* ================= UTILIDADES ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const minutos = h => { const [H,M] = h.split(":").map(Number); return H*60+M; };
const fimDe = h => { const t = minutos(h)+15; return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); };
const periodo = h => minutos(h) < 720 ? "Manhã" : minutos(h) < 1080 ? "Tarde" : "Noite";
const soDigitos = s => String(s || "").replace(/\D/g, "");
const limpar = s => String(s || "").trim().replace(/\s+/g, " ");
const resolve = v => typeof v === "function" ? v() : v;
const parseData = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dataLonga = s => { const t = parseData(s).toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"2-digit"}); return t.charAt(0).toUpperCase() + t.slice(1); };
const dataCurta = s => parseData(s).toLocaleDateString("pt-BR",{weekday:"short", day:"2-digit", month:"2-digit"}).replace(".", "");
const chaveSlot = s => s.data_id + "-" + s.horario_id;
let toastTimer;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4500); }

async function rpc(fn, body){
  let r;
  try{ r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}); }
  catch(e){ throw new Error("rede"); }
  const txt = await r.text();
  if(!r.ok){ let m = "servidor"; try{ m = JSON.parse(txt).message || m; }catch(e){} throw new Error(m); }
  return txt ? JSON.parse(txt) : null;
}

/* ================= REGRAS ================= */
const unidadeAtual = () => UNIDADE_UNICA[S.estado] || S.unidade;
const temAtuacao = () => UNIDADES_ATUACAO.includes(unidadeAtual());
const temAndar = () => UNIDADES_ANDAR.includes(unidadeAtual());
const temPlantao = () => UNIDADES_PLANTAO.includes(unidadeAtual()) && (!temAtuacao() || S.atuacao === "Plantonista");
function grupoBase(){
  if(!unidadeAtual()) return "";
  if(temAtuacao()) return S.atuacao === "ADM" ? "ADM" : (S.atuacao === "Plantonista" ? S.plantao : "");
  if(UNIDADES_PLANTAO.includes(unidadeAtual())) return S.plantao;
  if(temAndar()) return S.andar ? S.andar + " andar" : "";
  return "Geral";
}
function gruposPermitidos(){
  const base = grupoBase();
  if(!base) return [];
  if(!temAtuacao() && UNIDADES_PLANTAO.includes(unidadeAtual())) return [base, ...Object.keys(GRUPOS_EXTRAS)];
  return [base];
}
const nomeGrupo = g => g === "Par" || g === "Ímpar" ? "Plantão " + g : GRUPOS_EXTRAS[g] || (g === "Geral" ? "" : g);

/* Sequência de etapas (muda conforme as respostas) */
function etapas(){
  const e = ["nome", "estado"];
  if(UNIDADES[S.estado]) e.push("unidade");
  if(temAtuacao()) e.push("atuacao");
  if(temAndar()) e.push("andar");
  if(temPlantao()) e.push("plantao");
  e.push("horario", "contato");
  return e;
}
/* Uma etapa está completa? (usado para não pular etapas ao voltar/avançar pelo navegador) */
function completa(id){
  if(id === "nome") return S.nome.length >= 3;
  if(ESCOLHAS[id]) return !!S[id];
  if(id === "horario") return S.reserva || !!S.sel;
  return true;
}
function limiteValido(alvo){
  const lista = etapas();
  for(let i = 0; i < Math.min(alvo, lista.length - 1); i++) if(!completa(lista[i])) return i;
  return Math.min(alvo, lista.length - 1);
}

/* Etapas de escolha */
function icone(u){
  if(/^PS/.test(u)) return "PS";
  if(/Hospital/.test(u)) return "H";
  if(/Comercial/.test(u)) return "C";
  if(/^Amb/.test(u)) return "A";
  return "U";
}
const ESCOLHAS = {
  estado:  {k:"Local", t:"Onde você trabalha?", sub:"Selecione o estado da sua unidade.", grid:true,
            ops:() => ESTADOS.map(e => ({v:e.v, ic:e.s, d:e.d}))},
  unidade: {k:"Local", t:"Qual é a sua unidade?", sub:() => S.estado,
            ops:() => (UNIDADES[S.estado] || []).map(u => ({v:u, ic:icone(u)}))},
  atuacao: {k:"Sobre você", t:"Você atua em qual período?", sub:() => unidadeAtual(),
            ops:() => [{v:"ADM", ic:"ADM", d:"Horário administrativo"}, {v:"Plantonista", ic:"PL", d:"Escala de plantão"}]},
  andar:   {k:"Sobre você", t:"Você trabalha em qual andar?", sub:() => unidadeAtual(), grid:true,
            ops:() => [{v:"Segundo", ic:"2º", d:"Segundo andar"}, {v:"Terceiro", ic:"3º", d:"Terceiro andar"}]},
  plantao: {k:"Sobre você", t:() => `Quando você estará de plantão no mês de ${MES_ATUAL}?`, sub:"Escolha a escala do seu plantão.", grid:true,
            ops:() => [{v:"Par", ic:"PAR", d:"Dias pares"}, {v:"Ímpar", ic:"ÍMP", d:"Dias ímpares"}]}
};

/* ================= RENDERIZAÇÃO ================= */
const CK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;

function render(direcao){
  const lista = etapas();
  passo = Math.max(0, Math.min(passo, lista.length - 1));
  const id = lista[passo];
  let html = "";

  if(id === "nome"){
    html = `<div class="kicker">Inscrição</div><h2>Vamos agendar sua Quick Massage</h2>
      <p class="sub">Massagem rápida e localizada que alivia tensões musculares, reduz o estresse e promove relaxamento.</p>
      <div class="group" data-f="nome"><label class="label" for="f-nome">Seu nome completo</label>
      <input class="field" id="f-nome" type="text" autocomplete="name" maxlength="120" placeholder="Nome e sobrenome" value="${esc(S.nome)}">
      <div class="err">Informe seu nome e sobrenome.</div></div>`;
  }
  else if(ESCOLHAS[id]){
    const c = ESCOLHAS[id];
    html = `<div class="kicker">${esc(c.k)}</div><h2>${esc(resolve(c.t))}</h2><p class="sub">${esc(resolve(c.sub))}</p>
      <div class="choices${c.grid ? " grid" : ""}" role="radiogroup" data-q="${id}">` +
      resolve(c.ops).map(o => `<button type="button" class="choice" role="radio" aria-checked="${S[id] === o.v}" data-v="${esc(o.v)}">
        <span class="ic">${esc(o.ic)}</span><span class="tx"><b>${esc(o.v)}</b>${o.d ? `<span>${esc(o.d)}</span>` : ""}</span><span class="ck">${CK}</span></button>`).join("") +
      `</div>`;
  }
  else if(id === "horario"){
    html = `<div class="kicker">Agendamento</div><h2>Escolha o seu horário</h2>
      <p class="sub">${esc(unidadeAtual())}${S.andar ? " · " + esc(S.andar) + " andar" : ""} · sessões de 15 minutos.</p>
      <div id="slotBox" aria-live="polite">${htmlHorarios()}</div>`;
  }
  else if(id === "contato"){
    html = `<div class="kicker">Último passo</div><h2>Confirme seus dados</h2>
      <p class="sub">${S.reserva ? "Os horários estão preenchidos. Você entrará na lista de reserva." : "Revise o agendamento e informe seu contato."}</p>
      ${htmlResumo()}
      <div class="group" data-f="setor"><label class="label" for="f-setor">Seu setor</label>
      <input class="field" id="f-setor" type="text" maxlength="120" placeholder="Ex.: Recepção, Farmácia, UPC" value="${esc(S.setor)}">
      <div class="err">Informe o seu setor.</div></div>
      <div class="group" data-f="celular"><label class="label" for="f-celular">Celular com DDD</label>
      <input class="field" id="f-celular" type="tel" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="(00) 00000-0000" value="${esc(mascaraTel(S.celular))}">
      <div class="err">Informe um celular válido com DDD (11 dígitos).</div></div>`;
  }

  const st = $("stage");
  st.innerHTML = `<section class="step${direcao ? " anim" + (direcao < 0 ? " back" : "") : ""}">${html}</section>`;
  $("progress").firstElementChild.style.width = Math.round(((passo + 1) / lista.length) * 100) + "%";
  atualizarBarra();
  if(id === "horario") garantirHorarios();
}

function htmlResumo(){
  const linhas = [["Nome", S.nome], ["Unidade", unidadeAtual()]];
  if(S.andar) linhas.push(["Andar", S.andar + " andar"]);
  if(S.atuacao) linhas.push(["Atuação", S.atuacao]);
  if(S.plantao) linhas.push(["Plantão", S.plantao]);
  if(S.reserva) linhas.push(["Situação", "Lista de reserva"]);
  else if(S.sel){ linhas.push(["Data", dataLonga(S.sel.data)]); linhas.push(["Horário", `${S.sel.hora} às ${fimDe(S.sel.hora)}`]); }
  return `<dl class="summary">${linhas.map(([k,v]) => `<div class="row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
}

function atualizarBarra(){
  const id = etapas()[passo];
  const next = $("btnNext");
  $("actionbar").hidden = concluido;
  $("btnBack").hidden = passo === 0;
  $("backTop").hidden = passo === 0 || concluido;
  next.classList.remove("amber");
  if(enviando){ next.disabled = true; next.innerHTML = `<span class="spinner"></span>Enviando`; return; }
  next.disabled = false;
  if(ESCOLHAS[id]){ next.textContent = "Continuar"; next.disabled = !S[id]; }
  else if(id === "horario"){ next.textContent = "Continuar"; next.disabled = S.carregando || S.erroSlots || S.semDatas || (!S.reserva && !S.sel); }
  else if(id === "contato"){ next.textContent = S.reserva ? "Entrar na lista de reserva" : "Confirmar agendamento"; if(S.reserva) next.classList.add("amber"); }
  else next.textContent = "Continuar";
}

/* ================= HORÁRIOS ================= */
function htmlHorarios(){
  if(S.carregando || !S.chave) return `<div class="slots">${'<div class="skeleton"></div>'.repeat(8)}</div>`;
  if(S.erroSlots) return `<div class="state-box info"><div><b>Não foi possível carregar os horários.</b>Verifique a internet e tente de novo.
    <button type="button" class="btn btn-ghost" style="height:42px;margin-top:12px" data-acao="recarregar">Tentar de novo</button></div></div>`;
  if(S.semDatas) return `<div class="state-box info"><div><b>As datas desta unidade ainda não foram divulgadas.</b>Volte em breve: assim que a equipe do Programa Bem+VIVER cadastrar as datas, os horários aparecem aqui.</div></div>`;
  if(S.reserva) return `<div class="state-box warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
    <div><b>Os horários estão preenchidos</b>Você pode entrar na lista de reserva. Se abrir uma vaga, a equipe do Programa Bem+VIVER entra em contato pelo seu celular.</div></div>`;
  /* agrupa por data → escala → período */
  const porData = new Map();
  for(const s of S.slots){ if(!porData.has(s.data)) porData.set(s.data, []); porData.get(s.data).push(s); }
  const varias = porData.size > 1;
  let out = "";
  for(const [data, doDia] of [...porData].sort((a,b) => a[0].localeCompare(b[0]))){
    const porGrupo = new Map();
    for(const s of doDia){ if(!porGrupo.has(s.grupo)) porGrupo.set(s.grupo, []); porGrupo.get(s.grupo).push(s); }
    const grupos = [...porGrupo.keys()].sort((a,b) => (GRUPOS_EXTRAS[a]?1:0) - (GRUPOS_EXTRAS[b]?1:0));
    out += `<div class="slot-group"><h3>${esc(dataLonga(data))}</h3>`;
    for(const g of grupos){
      const itens = porGrupo.get(g).sort((a,b) => minutos(a.hora) - minutos(b.hora));
      if(grupos.length > 1) out += `<div class="escala">${esc(nomeGrupo(g))}</div>`;
      const porPeriodo = new Map();
      for(const s of itens){ const p = periodo(s.hora); if(!porPeriodo.has(p)) porPeriodo.set(p, []); porPeriodo.get(p).push(s); }
      for(const [p, lista] of porPeriodo){
        if(porPeriodo.size > 1) out += `<div class="period">${p}</div>`;
        out += `<div class="slots">` + lista.map(s => { const k = chaveSlot(s), on = S.sel && S.sel.k === k;
          return `<button type="button" class="slot" data-k="${k}" aria-pressed="${!!on}" aria-label="${esc(dataLonga(s.data))}, ${s.hora} até ${fimDe(s.hora)}"><b>${s.hora}</b><small>até ${fimDe(s.hora)}${s.livres > 1 ? ` · <em>${s.livres} vagas</em>` : ""}</small></button>`; }).join("") + `</div>`;
      }
    }
    out += `</div>`;
  }
  return out;
}
function garantirHorarios(){
  const chave = unidadeAtual() + "|" + grupoBase();
  if(chave !== S.chave || S.erroSlots){ S.chave = chave; S.sel = null; S.reserva = false; S.semDatas = false; carregarHorarios(); }
}
async function carregarHorarios(){
  const meu = ++req, chave = S.chave;
  S.carregando = true; S.erroSlots = false; pintarHorarios();
  try{
    const lista = await rpc("bemviver_vagas", {p_unidade: unidadeAtual()});
    if(meu !== req || chave !== S.chave) return;
    const ok = gruposPermitidos();
    const daPessoa = lista.filter(s => ok.includes(s.grupo));
    S.slots = daPessoa.filter(s => s.livres > 0);
    if(S.sel && !S.slots.some(s => chaveSlot(s) === S.sel.k)) S.sel = null;
    S.semDatas = daPessoa.length === 0;
    S.reserva = !S.semDatas && S.slots.length === 0;
  }catch(e){
    if(meu !== req) return;
    S.erroSlots = true; S.slots = []; S.semDatas = false; S.reserva = false;
  }
  S.carregando = false; pintarHorarios();
}
function pintarHorarios(){ const b = $("slotBox"); if(b) b.innerHTML = htmlHorarios(); atualizarBarra(); }

/* ================= NAVEGAÇÃO ================= */
function irPara(n, dir){
  clearTimeout(autoTimer);
  passo = limiteValido(Math.max(0, n));
  render(dir);
  window.scrollTo({top:0, behavior:"smooth"});
}
function avancar(){
  if(enviando || concluido) return;
  const id = etapas()[passo];
  if(!validarEtapa(id)) return;
  if(id === "contato"){ enviar(); return; }
  history.pushState({p: passo + 1}, "");
  irPara(passo + 1, 1);
}
function voltar(){ if(passo > 0 && !enviando) history.back(); }
window.addEventListener("popstate", e => {
  if(enviando){ history.pushState({p: passo}, ""); return; }
  if(concluido){ reiniciar(); return; }
  const p = e.state && typeof e.state.p === "number" ? e.state.p : 0;
  irPara(p, p < passo ? -1 : 1);
});

function marcarErro(f, ok){ const g = document.querySelector(`[data-f="${f}"]`); if(g) g.classList.toggle("invalid", !ok); return ok; }
function validarEtapa(id){
  if(id === "nome"){
    S.nome = limpar($("f-nome").value);
    const ok = marcarErro("nome", S.nome.length >= 3 && S.nome.includes(" "));
    if(!ok) $("f-nome").focus();
    return ok;
  }
  if(ESCOLHAS[id] || id === "horario") return completa(id);
  if(id === "contato"){
    S.setor = limpar($("f-setor").value); S.celular = soDigitos($("f-celular").value);
    const a = marcarErro("setor", S.setor.length >= 2);
    const b = marcarErro("celular", S.celular.length === 11 && S.celular[0] !== "0" && S.celular[2] === "9");
    if(!a) $("f-setor").focus(); else if(!b) $("f-celular").focus();
    return a && b;
  }
  return true;
}

/* ================= EVENTOS ================= */
$("btnNext").addEventListener("click", avancar);
$("btnBack").addEventListener("click", voltar);
$("backTop").addEventListener("click", voltar);

$("stage").addEventListener("click", e => {
  const ch = e.target.closest(".choice");
  if(ch){
    const q = ch.parentElement.dataset.q, v = ch.dataset.v;
    if(S[q] !== v){
      S[q] = v;
      if(q === "estado"){ S.unidade = ""; S.atuacao = ""; S.andar = ""; S.plantao = ""; }
      if(q === "unidade"){ S.atuacao = ""; S.andar = ""; S.plantao = ""; }
      if(q === "atuacao"){ S.plantao = ""; }
      S.chave = ""; S.sel = null; S.reserva = false;          /* horários precisam recarregar */
    }
    ch.parentElement.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-checked", x === ch));
    atualizarBarra();
    const naEtapa = passo;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => { if(passo === naEtapa) avancar(); }, 220);   /* avança sozinho, como um app */
    return;
  }
  const slot = e.target.closest(".slot");
  if(slot){
    const s = S.slots.find(x => chaveSlot(x) === slot.dataset.k);
    if(!s) return;
    S.sel = {k: slot.dataset.k, data_id: s.data_id, horario_id: s.horario_id, data: s.data, hora: s.hora};
    document.querySelectorAll(".slot").forEach(x => x.setAttribute("aria-pressed", x === slot));
    atualizarBarra();
    return;
  }
  if(e.target.closest('[data-acao="recarregar"]')) carregarHorarios();
});
$("stage").addEventListener("input", e => {
  const g = e.target.closest(".group"); if(g) g.classList.remove("invalid");
  if(e.target.id === "f-celular") e.target.value = mascaraTel(e.target.value);
  if(e.target.id === "f-nome") S.nome = limpar(e.target.value);
  if(e.target.id === "f-setor") S.setor = limpar(e.target.value);
  if(e.target.id === "f-celular") S.celular = soDigitos(e.target.value);
});
$("stage").addEventListener("keydown", e => { if(e.key === "Enter" && e.target.classList.contains("field")){ e.preventDefault(); avancar(); } });

function mascaraTel(v){
  const d = soDigitos(v).slice(0, 11);
  if(d.length <= 2) return d;
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  return `(${d.slice(0,2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`;
}

/* ================= ENVIO ================= */
const MENSAGENS = {
  horario_ocupado: "Esse horário acabou de ser preenchido. Escolha outro.",
  ha_vagas: "Abriu uma vaga! Escolha um horário.",
  duplicado: "Este celular já está inscrito neste mês. Para mudar o horário, fale com a equipe do Programa Bem+VIVER.",
  sem_datas: "As datas desta unidade ainda não foram divulgadas.",
  inscricoes_fechadas: "As inscrições foram encerradas.",
  rede: "Sem conexão. Verifique a internet e tente novamente."
};
async function enviar(){
  if(enviando) return;
  enviando = true; atualizarBarra();
  const dados = {nome:S.nome, estado:S.estado, unidade:unidadeAtual(), atuacao:S.atuacao || null, plantao:S.plantao || null,
                 andar:S.andar || null, horario_id:S.reserva || !S.sel ? null : S.sel.horario_id, data_id:S.reserva || !S.sel ? null : S.sel.data_id,
                 setor:S.setor, celular:S.celular};
  try{
    const r = await rpc("bemviver_inscrever", {d: dados});
    enviando = false;
    mostrarConfirmacao(r);
  }catch(err){
    enviando = false;
    const m = err.message;
    toast(MENSAGENS[m] || "Não foi possível enviar. Confira os dados e tente novamente.");
    if(m === "inscricoes_fechadas"){ mostrarFechado(); return; }
    if(m === "horario_ocupado" || m === "ha_vagas" || m === "sem_datas"){
      S.sel = null; S.chave = "";
      const i = etapas().indexOf("horario");
      history.pushState({p: i}, "");
      irPara(i, -1);
    } else atualizarBarra();
  }
}
function mostrarConfirmacao(r){
  concluido = true;
  const ag = r && r.status === "agendado";
  const linhas = [["Nome", S.nome], ["Unidade", unidadeAtual()]];
  if(S.andar) linhas.push(["Andar", S.andar + " andar"]);
  if(S.atuacao) linhas.push(["Atuação", S.atuacao]);
  if(ag){
    if(r.data) linhas.push(["Data", dataLonga(r.data)]);
    linhas.push(["Horário", `${r.hora} às ${fimDe(r.hora)}`]);
    if(nomeGrupo(r.grupo)) linhas.push(["Escala", nomeGrupo(r.grupo)]);
  }else{
    if(S.plantao) linhas.push(["Plantão", S.plantao]);
    linhas.push(["Situação", "Lista de reserva"]);
  }
  const icOk = `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
  const icRes = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
  $("stage").innerHTML = `<section class="done step anim">
    <div class="badge${ag ? "" : " res"}">${ag ? icOk : icRes}</div>
    <h2>${ag ? "Agendamento confirmado!" : "Você está na lista de reserva"}</h2>
    <p>${ag ? "Guarde estas informações. Se preferir, faça uma captura de tela." : "Todos os horários estavam preenchidos. Se abrir uma vaga, a equipe do Programa Bem+VIVER entra em contato pelo seu celular."}</p>
    <dl class="summary">${linhas.map(([k,v]) => `<div class="row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    <button type="button" class="btn btn-ghost btn-block" id="again">Fazer outra inscrição</button></section>`;
  $("progress").firstElementChild.style.width = "100%";
  atualizarBarra();
  $("again").addEventListener("click", reiniciar);
  window.scrollTo({top:0, behavior:"smooth"});
}
function reiniciar(){
  if(!MES_ABERTO){ mostrarFechado(); return; }
  S = VAZIO(); concluido = false; enviando = false; req++;
  history.replaceState({p:0}, "");
  irPara(0, -1);
}

/* ================= INÍCIO ================= */
function mostrarFechado(){
  concluido = true;
  $("stage").innerHTML = `<section class="done step anim"><div class="badge res"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>Inscrições fechadas</h2><p>No momento não há inscrições abertas para a Quick Massage. Fique de olho nos comunicados do Programa Bem+VIVER.</p></section>`;
  $("progress").firstElementChild.style.width = "0";
  atualizarBarra();
}
async function iniciar(){
  $("stage").innerHTML = `<section class="step"><div class="slots">${'<div class="skeleton"></div>'.repeat(6)}</div></section>`;
  $("actionbar").hidden = true;
  try{
    const r = await rpc("bemviver_mes_aberto", {});
    MES_ABERTO = r && r[0] ? r[0] : null;
  }catch(e){
    $("stage").innerHTML = `<section class="done step"><h2>Sem conexão</h2><p>Não foi possível carregar a inscrição. Verifique a internet.</p><button type="button" class="btn btn-primary btn-block" id="retryInit">Tentar de novo</button></section>`;
    $("retryInit").addEventListener("click", iniciar);
    return;
  }
  if(!MES_ABERTO){ mostrarFechado(); return; }
  MES_ATUAL = MESES[MES_ABERTO.mes - 1];
  concluido = false;
  history.replaceState({p:0}, "");
  render(0);
}
iniciar();
</script>
</body>
</html>
